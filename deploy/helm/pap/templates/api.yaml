apiVersion: v1
kind: ServiceAccount
metadata:
  name: pap-api
  labels: {{- include "pap.labels" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pap-api
  labels: {{- include "pap.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: pap-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pap-api
        {{- include "pap.labels" . | nindent 8 }}
    spec:
      serviceAccountName: pap-api
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ include "pap.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          env:
            {{- range $k, $v := .Values.api.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
            - {name: PAP_REDIS_URL, value: "redis://pap-redis:6379/0"}
            {{- if .Values.mockLlm.enabled }}
            - {name: PAP_LLM_GATEWAY_URL, value: "http://pap-mock-llm:8010"}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: PAP_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pap-db-pguser-pap, key: pgbouncer-uri}
            {{- end }}
          envFrom:
            - secretRef: {name: {{ .Values.api.existingSecret }}, optional: true}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]  # fastembed cache, uvicorn temp
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: pap-api
  labels: {{- include "pap.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: pap-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
# Chaos drill kills one api pod at a time; this keeps at least one serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pap-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: pap-api}
