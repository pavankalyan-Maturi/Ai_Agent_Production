[project]
name = "prod-agent-platform"
version = "0.1.0"
description = "Production-grade agentic RAG platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.165,<0.166",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.16,<3",
  "psycopg[binary,pool]>=3.3,<3.4",
  "redis>=8.2,<9",
  "prometheus-client>=0.26,<0.27",
  "opentelemetry-api>=1.45,<1.46",
  "opentelemetry-sdk>=1.45,<1.46",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<1.46",
  "opentelemetry-instrumentation-fastapi==0.66b2",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3",
  "httpx2>=2.13",
  "ruff>=0.14",
  "mypy>=1.18",
  "pre-commit>=4",
  "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs the compose core profile running"]
addopts = "-m 'not integration'"
