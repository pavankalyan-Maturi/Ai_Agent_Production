[project]
name = "prod-agent-platform"
version = "0.1.0"
description = "Production-grade agentic RAG platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.165,<0.166",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.16,<3",
  "psycopg[binary,pool]>=3.3,<3.4",
  "redis>=8.2,<9",
  "prometheus-client>=0.26,<0.27",
  "opentelemetry-api>=1.45,<1.46",
  "opentelemetry-sdk>=1.45,<1.46",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<1.46",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "pgvector>=0.5.1,<0.6",
  "numpy>=2.3,<3",
  "anthropic>=2.14,<3",
  "celery>=5.7,<5.8",
  "boto3>=1.44,<1.45",
  "langgraph==1.2.24",
  "langgraph-checkpoint==4.3.2",
  "langgraph-checkpoint-postgres==3.2.1",
  "langgraph-prebuilt==1.1.3",
  "opentelemetry-semantic-conventions==0.66b2",
  "mcp-rbac-gateway>=0.2.0,<0.3",
  "mcp[cli]==2.3.*",
  "a2a-sdk[http-server,signing]>=1.1,<2",
  "httpx>=0.28,<0.30",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3",
  "httpx2>=2.13",
  "ruff>=0.14",
  "mypy>=1.18",
  "pre-commit>=4",
  "pip-audit>=2.9",
  "moto[server]>=5.2,<6",
  "boto3-stubs[s3]>=1.44",
]

# Local CPU embedding + rerank models (ONNX). Used by the eval job and later by ingestion workers.
eval = [
  "fastembed>=0.9.1,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "retrieval", "evals", "gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Eval harness: long table literals, seeded (non-crypto) sampling.
"evals/**" = ["E501", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["evals.*"]
disallow_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["opentelemetry.instrumentation.*", "pgvector.*", "fastembed.*", "celery.*", "kombu.*", "moto.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
# Celery and kombu ship no type information.
module = ["apps.ingest.*"]
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs the compose core profile running"]
addopts = "-m 'not integration'"
