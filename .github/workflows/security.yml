name: security
on:
  pull_request:
  schedule: [{cron: "0 6 * * 1"}]
permissions: {contents: read}
jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.11.32"}
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - run: uvx pip-audit==2.10.1 -r requirements.txt --disable-pip
  trivy-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pap-api:scan .
      # Trivy run from its pinned image rather than trivy-action (fewer moving parts in the supply chain).
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3
          image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 pap-api:scan
  trivy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.69.3
          config --severity CRITICAL,HIGH --exit-code 1 .
      # Secret scan of our own source. The image scan is vuln-only: third-party site-packages
      # trip the secret rules on docstring placeholders (anthropic SDK, CRITICAL false positive).
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.69.3
          fs --scanners secret --skip-dirs .venv --exit-code 1 .
