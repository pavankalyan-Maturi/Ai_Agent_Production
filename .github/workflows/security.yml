name: security
on:
  pull_request:
  schedule: [{cron: "0 6 * * 1"}]
permissions: {contents: read}
jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.11.32"}
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - run: uvx pip-audit==2.10.1 -r requirements.txt --disable-pip
  trivy-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pap-api:scan .
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: pap-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
  trivy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@0.33.1
        with: {scan-type: config, scan-ref: ., severity: "CRITICAL,HIGH", exit-code: "1"}
