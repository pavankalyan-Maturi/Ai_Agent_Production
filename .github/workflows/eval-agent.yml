name: eval-agent
on:
  workflow_dispatch:
    inputs:
      questions: {description: "HotpotQA distractor validation questions", default: "100"}
      max_usd: {description: "Hard cap on new API spend for this run", default: "2"}
  pull_request:
    paths: ["agent/**", "evals/agent/**", ".github/workflows/eval-agent.yml"]
permissions: {contents: read}
concurrency:
  group: eval-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env: {POSTGRES_USER: t, POSTGRES_PASSWORD: t, POSTGRES_DB: t}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t" --health-interval 2s --health-retries 30
    env:
      FASTEMBED_CACHE_PATH: .cache/fastembed
      # Fork PRs get no secrets: every arm then reports NOT MEASURED and the job passes.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.11.32", enable-cache: true}
      - run: uv sync --frozen --python 3.12 --all-groups
      - name: Cache dataset and models
        uses: actions/cache@v4
        with:
          path: |
            .cache/hotpot
            .cache/fastembed
          key: hotpot-fastembed-v1
      - name: Cache model responses (content-addressed; unchanged code re-runs for free)
        uses: actions/cache@v4
        with:
          path: .cache/agent_llm
          key: agent-llm-${{ github.run_id }}
          restore-keys: agent-llm-
      - name: Run memory ablation (eval-gate:agent)
        run: >-
          uv run python -m evals.agent.run
          --dsn postgresql://t:t@localhost:5432/t
          --questions ${{ inputs.questions || '100' }}
          --max-usd ${{ inputs.max_usd || '2' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: agent-ablation, path: results/agent}
