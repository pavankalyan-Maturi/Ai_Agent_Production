name: ci
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-type-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.11.32", enable-cache: true}
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps retrieval evals agent mcp_server agent_a2a
      - run: uv run pytest -q

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env: {POSTGRES_USER: t, POSTGRES_PASSWORD: t, POSTGRES_DB: t}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t" --health-interval 2s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.2-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 30
    env:
      PAP_TEST_DATABASE_URL: postgresql://t:t@localhost:5432/t
      PAP_TEST_BROKER_URL: amqp://guest:guest@localhost:5672//
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.11.32", enable-cache: true}
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q -m integration -s
