name: compose-smoke
on:
  pull_request:
  workflow_dispatch:
    inputs:
      llmobs: {description: "Also boot Langfuse v4 (heavy)", type: boolean, default: true}
permissions: {contents: read}
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with: {context: ., load: true, tags: "pap-api:dev", cache-from: type=gha, cache-to: "type=gha,mode=max"}
      - name: Boot core+obs(+llmobs) and assert acceptance
        run: scripts/compose_smoke.sh ${{ (github.event_name != 'workflow_dispatch' || inputs.llmobs) && '--llmobs' || '' }}
      - name: Probe latency
        run: |
          pip install -q httpx2==2.16.2
          python scripts/bench_probes.py -n 500 | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile full logs --tail 200
      - if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile full down -v
